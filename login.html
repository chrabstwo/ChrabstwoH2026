<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie przez Discord - Chrabstwo 4Life</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #161922;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #161922;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .login-box {
            background: #1e222d;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: left;
            border: 1px solid #2a2e3d;
            width: 400px;
        }
        .login-box h3 { 
            margin: 0 0 20px 0; 
            font-size: 16px; 
            color: #e2e8f0; 
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.4;
            user-select: none;
        }
        .checkbox-container input {
            margin-top: 2px;
            cursor: pointer;
            accent-color: #5865F2;
            width: 16px;
            height: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background-color: #5865F2;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.17s ease, transform 0.1s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.2);
        }
        .login-box button:hover:not(:disabled) {
            background-color: #4752C4;
            box-shadow: 0 6px 16px rgba(88, 101, 242, 0.4);
        }
        .login-box button:active:not(:disabled) {
            background-color: #3c45a5;
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(88, 101, 242, 0.2);
        }
        .login-box button svg {
            transition: transform 0.17s ease;
        }
        .login-box button:hover:not(:disabled) svg {
            transform: scale(1.1);
        }
        .login-box button:active:not(:disabled) svg {
            transform: scale(0.95);
        }
        .login-box button:disabled {
            background-color: #2a2e3d;
            color: #72767d;
            cursor: not-allowed;
            box-shadow: none;
        }

        .button-loader {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            height: 24px;
        }
        .button-loader span {
            width: 7px;
            height: 7px;
            background-color: white;
            border-radius: 50%;
            animation: discord-dots 1.4s infinite ease-in-out both;
        }
        .button-loader span:nth-child(1) { animation-delay: -0.32s; }
        .button-loader span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes discord-dots {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1.0); opacity: 1; }
        }

        .error-msg { color: #ff5252; font-size: 13px; margin-top: 12px; text-align: center; display: none; }

        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            font-size: 15px;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #2a2e3d;
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box-wrapper" class="login-box">
        <h3>Zaloguj się przez Discord, aby uzyskać dostęp do mapy organizacji</h3>
        
        <label class="checkbox-container">
            <input type="checkbox" id="org-checkbox">
            <span>Oświadczam, że jestem członkiem organizacji Chrabstwo i używam mapy wyłącznie do wspólnych poszukiwań dyń wewnątrz organizacji.</span>
        </label>

        <button id="login-btn" disabled>
            <span id="btn-content" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.79,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.81,11.1,105.25,105.25,0,0,0,32.25-16.15c2.62-27.28-4.51-51.2-19.26-72Zm-72,50.32c-6.08,0-11.08-5.6-11.08-12.5s5-12.5,11.08-12.5c6.11,0,11.11,5.6,11.08,12.5C46.78,52.79,41.8,58.39,35.7,58.39Zm55.76,0c-6.08,0-11.08-5.6-11.08-12.5s5-12.5,11.08-12.5c6.11,0,11.11,5.6,11.08,12.5C102.57,52.79,97.59,58.39,91.46,58.39Z"/>
                </svg>
                Zaloguj przez Discord
            </span>
            <span class="button-loader" id="btn-loader">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </button>
        <div id="error" class="error-msg"></div>
    </div>

    <div id="loader-wrapper" class="loader-container">
        <div class="spinner"></div>
        <span id="loader-text">Wczytywanie i weryfikacja uprawnień...</span>
    </div>
</div>

<script>
    const CLIENT_ID = "706161537852768296"; 
    const REDIRECT_URI = window.location.origin + window.location.pathname; 
    const WORKER_URL = "https://patient-star-01ba.frebcraft17.workers.dev"; 

    const loginBox = document.getElementById("login-box-wrapper");
    const loader = document.getElementById("loader-wrapper");
    const loaderText = document.getElementById("loader-text");
    const checkbox = document.getElementById("org-checkbox");
    const btn = document.getElementById("login-btn");
    const btnContent = document.getElementById("btn-content");
    const btnLoader = document.getElementById("btn-loader");
    const errorDiv = document.getElementById("error");

    checkbox.addEventListener("change", function() {
        btn.disabled = !this.checked;
    });

    const fragment = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = fragment.get("access_token");

    if (accessToken) {
        pokażLoader("Pobieranie danych użytkownika z Discorda...");
        
        fetch("https://discord.com/api/users/@me", {
            headers: { authorization: `Bearer ${accessToken}` }
        })
        .then(res => res.json())
        .then(user => {
            if (!user.id) throw new Error("Nie udało się pobrać ID użytkownika.");
            
            localStorage.setItem("discord_user_id", user.id);
            localStorage.setItem("discord_access_token", accessToken);
            
            window.history.replaceState({}, document.title, window.location.pathname);
            
            zweryfikujIWejdz(user.id);
        })
        .catch(err => {
            pokazBladLogowania("Błąd autoryzacji Discord: " + err.message);
        });
    } else {
        const savedUserId = localStorage.getItem("discord_user_id");
        
        if (savedUserId) {
            pokażLoader("Sprawdzanie uprawnień w bazie organizacji...");
            zweryfikujIWejdz(savedUserId);
        }
    }

    btn.addEventListener("click", function() {
        if (!checkbox.checked) return;
        
        btn.disabled = true;
        btnContent.style.display = "none";
        btnLoader.style.display = "flex";

        setTimeout(() => {
            const discordAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = discordAuthUrl;
        }, 300);
    });

    // Funkcja migrująca puste chmury z lokalnych cookies/localStorage przy logowaniu
    async function synchronizujPustaChmureW3Tle(userId) {
        const eventyDoSprawdzenia = ['dynie2026', 'cukierki2026'];
        
        for (const ev of eventyDoSprawdzenia) {
            try {
                const res = await fetch(`${WORKER_URL}/members/event/${ev}/read?discordId=${userId}`);
                const data = await res.json();

                if (!data.exists || !data.items || data.items.length === 0) {
                    const localKey = `chrabstwo_zebrane_${ev}`;
                    let lokalneDane = JSON.parse(localStorage.getItem(localKey) || "[]");
                    
                    if (lokalneDane.length === 0) {
                        if (ev === 'dynie2026') {
                            lokalneDane = JSON.parse(localStorage.getItem('chrabstwo_zebrane_dynie_dynie2026') || localStorage.getItem('chrabstwo_zebrane_dynie') || "[]");
                        } else if (ev === 'cukierki2026') {
                            lokalneDane = JSON.parse(localStorage.getItem('chrabstwo_zebrane_dynie_cukierki2026') || "[]");
                        }
                    }

                    if (lokalneDane.length > 0) {
                        await fetch(`${WORKER_URL}/members/event/${ev}/migrate`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ discordId: userId, items: lokalneDane })
                        });
                    }
                }
            } catch (e) {
                console.error(`Błąd automatycznej synchronizacji chmury dla ${ev}:`, e);
            }
        }
    }

    async function zweryfikujIWejdz(userId) {
        loaderText.innerText = "Weryfikacja uprawnień członka organizacji...";

        try {
            const res = await fetch(`${WORKER_URL}/members/read?userId=${userId}`);
            const data = await res.json();

            if (data.allowed) {
                const zaGodzine = new Date().getTime() + (60 * 60 * 1000);
                localStorage.setItem("login_wygasa", zaGodzine);

                loaderText.innerText = "Synchronizowanie postępów z chmurą...";
                await synchronizujPustaChmureW3Tle(userId);

                loaderText.innerText = "Zalogowano pomyślnie! Ładowanie mapy...";
                setTimeout(() => {
                    window.location.href = "map.html?event=dynie2026&json=dynie26.json";
                }, 1000);
            } else {
                wylogujIBlad("Odmowa dostępu: Twoje konto nie posiada wymaganej rangi 'Członek org' na serwerze Discord.");
            }
        } catch (err) {
            wylogujIBlad("Błąd połączenia z serwerem weryfikacji.");
        }
    }

    function pokażLoader(tekst) {
        loginBox.style.display = "none";
        loader.style.display = "flex";
        loaderText.innerText = tekst;
    }

    function pokazBladLogowania(tekst) {
        loginBox.style.display = "block";
        loader.style.display = "none";
        errorDiv.innerText = tekst;
        errorDiv.style.display = "block";
    }

    function wylogujIBlad(tekst) {
        localStorage.removeItem("discord_user_id");
        localStorage.removeItem("discord_access_token");
        localStorage.removeItem("login_wygasa");
        loginBox.style.display = "block";
        loader.style.display = "none";
        errorDiv.innerText = tekst;
        errorDiv.style.display = "block";
    }
</script>

</body>
</html>
