<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel logowania - Chrabstwo 4Life</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #161922;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #161922;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }
        .login-box {
            background: #1e222d;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: left;
            border: 1px solid #2a2e3d;
            width: 380px;
        }
        .login-box h3 { 
            margin: 0 0 16px 0; 
            font-size: 15px; 
            color: #e2e8f0; 
            font-weight: 500;
            text-align: center;
        }
        .login-box input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: #141720;
            border: 1px solid #2a2e3d;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .login-box input[type="password"]:focus {
            border-color: #00b894;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
            cursor: pointer;
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.4;
            user-select: none;
        }
        .checkbox-container input {
            margin-top: 2px;
            cursor: pointer;
            accent-color: #00b894;
            width: 16px;
            height: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #00b894;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .login-box button:hover { background: #019875; }
        .error-msg { color: #ff5252; font-size: 13px; margin-top: 10px; text-align: center; display: none; }

        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            font-size: 15px;
        }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #2a2e3d;
            border-top: 4px solid #00b894;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box-wrapper" class="login-box">
        <h3>Wprowadź hasło, aby uzyskać dostęp do mapy</h3>
        <input type="password" id="password-input" placeholder="Hasło do mapy" autofocus>
        
        <label class="checkbox-container">
            <input type="checkbox" id="org-checkbox">
            <span>Oświadczam, że jestem członkiem organizacji Chrabstwo i używam mapy wyłącznie do wspólnych poszukiwań dyń wewnątrz organizacji.</span>
        </label>

        <button id="login-btn">Zaloguj</button>
        <div id="error" class="error-msg" style="display:none;"></div>
    </div>

    <div id="loader-wrapper" class="loader-container">
        <div class="spinner"></div>
        <span>Ładowanie mapy organizacji...</span>
    </div>
</div>

<script>
    const POPRAWNE_HASLO = "4life2026"; // Hasło możesz zmienić tutaj

    const overlay = document.getElementById("login-overlay");
    const loginBox = document.getElementById("login-box-wrapper");
    const loader = document.getElementById("loader-wrapper");
    const input = document.getElementById("password-input");
    const checkbox = document.getElementById("org-checkbox");
    const btn = document.getElementById("login-btn");
    const errorDiv = document.getElementById("error");

    // Jeśli użytkownik ma już ważną sesję, od razu wyrzuca go na mapę
    const wygasniecie = localStorage.getItem("login_wygasa");
    const teraz = new Date().getTime();
    if (wygasniecie && teraz < parseInt(wygasniecie)) {
        window.location.href = "index.html";
    }

    function pokazBlad(tekst) {
        errorDiv.innerText = tekst;
        errorDiv.style.display = "block";
    }

    function zaloguj() {
        errorDiv.style.display = "none";

        if (!checkbox.checked) {
            pokazBlad("Musisz zaznaczyć oświadczenie członka organizacji!");
            return;
        }

        if (input.value !== POPRAWNE_HASLO) {
            pokazBlad("Błędne hasło!");
            return;
        }

        // Zapis sesji na 1 godzinę
        const zaWodzine = new Date().getTime() + (60 * 60 * 1000);
        localStorage.setItem("login_wygasa", zaWodzine);

        // Pokazujemy ładujące kółko i po chwili przenosimy do index.html
        loginBox.style.display = "none";
        loader.style.display = "flex";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 2000);
    }

    btn.addEventListener("click", zaloguj);
    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            zaloguj();
        }
    });
</script>

</body>
</html>
