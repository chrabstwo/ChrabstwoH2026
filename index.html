<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dyń 4Life - Halloween</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #161922;
        }
        .popup-img {
            max-width: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Sprawdzenie sesji (1 godzina) - jeśli minęła lub brak, wraca do logowania
    const wygasniecie = localStorage.getItem("login_wygasa");
    const teraz = new Date().getTime();

    if (!wygasniecie || teraz >= parseInt(wygasniecie)) {
        localStorage.removeItem("login_wygasa");
        window.location.href = "login.html";
    }

    // Inicjalizacja mapy
    const bounds = [[0, 0], [2048, 2048]];
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -1,
        maxZoom: 3,
        maxBounds: bounds
    });

    L.imageOverlay('map_hq.jpg', bounds).addTo(map);
    map.fitBounds(bounds);

    // Przykładowa dynia
    L.marker([1024, 1024]).addTo(map)
        .bindPopup("<b>Środek mapy</b><br>Przykładowa dynia organizacji");
</script>

</body>
</html>
