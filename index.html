<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dyń 4Life</title>
    <script>
        // Sprawdzenie sesji ogólnego dostępu (1 godzina)
        const wygasniecie = localStorage.getItem("login_wygasa");
        const teraz = new Date().getTime();

        if (!wygasniecie || teraz >= parseInt(wygasniecie)) {
            localStorage.removeItem("login_wygasa");
            window.location.href = "login.html";
        } else {
            window.location.href = "map.html";
        }
    </script>
</head>
<body style="background-color: #0b0e14;">
</body>
</html>
