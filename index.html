<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrabstwo 4Life</title>
    <script>
        // Sprawdzamy czy użytkownik jest zalogowany przez Discorda
        const discordUserId = localStorage.getItem("discord_user_id");
        const wygasniecie = localStorage.getItem("login_wygasa");
        const teraz = new Date().getTime();

        if (!discordUserId || !wygasniecie || teraz >= parseInt(wygasniecie)) {
            localStorage.removeItem("discord_user_id");
            localStorage.removeItem("discord_access_token");
            localStorage.removeItem("login_wygasa");
            window.location.href = "login.html";
        } else {
            window.location.href = "map.html";
        }
    </script>
</head>
<body style="background-color: #0b0e14;">
</body>
</html>
