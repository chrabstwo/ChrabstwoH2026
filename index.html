<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dyń 4Life - Halloween</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
        }
        .popup-img {
            max-width: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }
        /* Styl ekranu logowania */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 14, 20, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: sans-serif;
            color: white;
        }
        .login-box {
            background: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #30363d;
            width: 300px;
        }
        .login-box h2 { margin-bottom: 20px; font-size: 20px; color: #ff751a; }
        .login-box input {
            width: 85%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #ff751a;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-box button:hover { background: #e06512; }
        .error-msg { color: #f85149; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<!-- Ekran logowania -->
<div id="login-overlay">
    <div class="login-box">
        <h2>🎃 Mapa Dyń 4Life</h2>
        <input type="password" id="password-input" placeholder="Wpisz hasło..." autofocus>
        <button onclick="checkPassword()">Wejdź na mapę</button>
        <div id="error" class="error-msg">Błędne hasło!</div>
    </div>
</div>

<div id="map"></div>
