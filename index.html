<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dyń 4Life - Halloween</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
        }
        .popup-img {
            max-width: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Definiujemy wymiary grafiki mapy (2048 x 2048 pikseli)
    const bounds = [[0, 0], [2048, 2048]];

    // 2. Inicjalizacja prostej mapy płaskiej
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -1,
        maxZoom: 2,
        maxBounds: bounds
    });

    // 3. Wczytanie wgranego pliku mapa.jpg
    L.imageOverlay('mapa.jpg', bounds).addTo(map);
    map.fitBounds(bounds);

    // 4. Tutaj dodajesz swoje dynie (współrzędne Y, X na obrazku)
    // Przykłady:
    
    L.marker([1000, 1000]).addTo(map)
        .bindPopup("<b>Dynia #1</b><br>Przechowalnia San Fierro");

    L.marker([1200, 1500]).addTo(map)
        .bindPopup("<b>Dynia #2</b><br>Lotnisko Las Venturas<br><img src='https://i.imgur.com/TwojScreen.jpg' class='popup-img'>");

</script>

</body>
</html>
