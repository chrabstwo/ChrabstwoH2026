<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dyń 4Life - Halloween</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
        }
        .popup-img {
            max-width: 220px;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Ustawiamy zasięg mapy (od 0,0 do 2048,2048)
    const bounds = [[0, 0], [2048, 2048]];

    // 2. Inicjalizacja prostej mapy 2D
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -1,
        maxZoom: 3,
        maxBounds: bounds
    });

    // 3. Wczytanie Twojego pliku map_hq.jpg
    L.imageOverlay('map_hq.jpg', bounds).addTo(map);
    map.fitBounds(bounds);

    // 4. Miejsce na Twoje dynie (pozycje Y, X)
    L.marker([1024, 1024]).addTo(map)
        .bindPopup("<b>Środek mapy</b><br>Przykładowa dynia");

</script>

</body>
</html>
