<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Dyń 4Life - Halloween</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #161922;
        }
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #161922;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-family: sans-serif;
        }
        .login-box {
            background: #1e222d;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: left;
            border: 1px solid #2a2e3d;
            width: 380px;
        }
        .login-box h3 { 
            margin: 0 0 16px 0; 
            font-size: 15px; 
            color: #e2e8f0; 
            font-weight: 500;
            text-align: center;
        }
        .login-box input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            margin-bottom: 14px;
            background: #141720;
            border: 1px solid #2a2e3d;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .login-box input[type="password"]:focus {
            border-color: #00b894;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
            cursor: pointer;
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.4;
            user-select: none;
        }
        .checkbox-container input {
            margin-top: 2px;
            cursor: pointer;
            accent-color: #00b894;
            width: 16px;
            height: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #00b894;
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .login-box button:hover { background: #019875; }
        .error-msg { color: #ff5252; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<!-- Ekran logowania -->
<div id="login-overlay">
    <div class="login-box">
        <h3>Wprowadź hasło, aby uzyskać dostęp do mapy</h3>
        <input type="password" id="password-input" placeholder="Hasło do mapy">
        
        <!-- Oświadczenie organizacji -->
        <label class="checkbox-container">
            <input type="checkbox" id="org-checkbox">
            <span>Oświadczam, że jestem członkiem organizacji Chrabstwo i używam mapy wyłącznie do wspólnych poszukiwań dyń wewnątrz organizacji.</span>
        </label>

        <button id="login-btn">Zaloguj</button>
        <div id="error" class="error-msg" style="display:none;"></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // TUTAJ WPISZ SWOJE HASŁO DLA ORGANIZACJI:
    const POPRAWNE_HASLO = "4life2026";

    const overlay = document.getElementById("login-overlay");
    const input = document.getElementById("password-input");
    const checkbox = document.getElementById("org-checkbox");
    const btn = document.getElementById("login-btn");
    const errorDiv = document.getElementById("error");

    // Sprawdzanie czy minęła już godzina od ostatniego logowania
    const wygasniecie = localStorage.getItem("login_wygasa");
    const teraz = new Date().getTime();

    if (wygasniecie && teraz < parseInt(wygasniecie)) {
        // Jeśli godzina jeszcze nie minęła, ukryj okienko logowania
        overlay.style.display = "none";
    } else {
        // Jeśli minęła lub nie było logowania, wyczyść starą pamięć
        localStorage.removeItem("login_wygasa");
    }

    function pokazBlad(tekst) {
        errorDiv.innerText = tekst;
        errorDiv.style.display = "block";
    }

    function zaloguj() {
        errorDiv.style.display = "none";

        if (!checkbox.checked) {
            pokazBlad("Musisz zaznaczyć oświadczenie członka organizacji!");
            return;
        }

        if (input.value !== POPRAWNE_HASLO) {
            pokazBlad("Błędne hasło!");
            return;
        }

        // Sukces – zapisujemy czas wygaśnięcia za dokładnie 1 godzinę (60 min * 60 sek * 1000 ms)
        const zaWodzine = new Date().getTime() + (60 * 60 * 1000);
        localStorage.setItem("login_wygasa", zaWodzine);

        overlay.style.display = "none";
        setTimeout(() => { map.invalidateSize(); }, 200);
    }

    btn.addEventListener("click", zaloguj);
    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            zaloguj();
        }
    });

    // Inicjalizacja mapy
    const bounds = [[0, 0], [2048, 2048]];
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -1,
        maxZoom: 3,
        maxBounds: bounds
    });

    L.imageOverlay('map_hq.jpg', bounds).addTo(map);
    map.fitBounds(bounds);

    L.marker([1024, 1024]).addTo(map)
        .bindPopup("<b>Środek mapy</b><br>Przykładowa dynia organizacji");
</script>

</body>
</html>
