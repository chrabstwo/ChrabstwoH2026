name: Skrobacz cen MTA4Life

on:
  schedule:
    - cron: '* * * * *' # Uruchamia się co minutę
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalacja zależności
        run: npm install puppeteer axios

      - name: Uruchomienie skryptu
        run: node scrape.js
